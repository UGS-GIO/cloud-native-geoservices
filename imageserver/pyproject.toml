[project]
name = "imageserver"
version = "0.1.0"
description = "ArcGIS ImageServer over Cloud Optimized GeoTIFFs listed in STAC, on titiler and rio-tiler"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "titiler.core==2.4.0",
    "rio-tiler==9.4.12",
    "rasterio==1.5.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imageserver"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]
